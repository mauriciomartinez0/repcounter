# Desarrollo: base de datos + API.  docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repcounter
      POSTGRES_PASSWORD: repcounter
      POSTGRES_DB: repcounter
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "repcounter"]
      interval: 2s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://repcounter:repcounter@db:5432/repcounter
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APP_ENV: dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
